# SparkyLink - staticki SPA build (React) + prosledjivanje API-ja backendu.
# Ispred stoji Traefik (TLS), iza je sparky-api (Laravel, nginx + php-fpm na 8080).

# Traefik vec postavlja X-Forwarded-Proto; lokalno bez njega vazi sema ovog zahteva.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Video snimci sa telefona; isto ogranicenje ima i PHP (UPLOAD_MAX_SIZE).
    client_max_body_size 600m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Docker DNS; ime backenda se razresava pri zahtevu, pa nginx startuje i kad
    # backend jos nije gore.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://sparky-api:8080;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location ~ ^/(api|up)(/|$) {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        # Otpremanje ide pravo backendu (bez baferovanja na disk ovde),
        # a video se pusta u delovima (Range).
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Vite daje hash u imenu fajla - moze da se kesira zauvek.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html, service worker i manifest se ne kesiraju, da nova verzija odmah stigne.
    location ~ ^/(index\.html|sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: svaka ruta vodi na index.html (TanStack Router radi ostatak).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
